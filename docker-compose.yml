version: "3.8"

services:
  mastchain-ais:
    image: ghcr.io/c-man-the-man/mastchain-ais:latest
    container_name: mastchain-ais
    restart: unless-stopped

    devices:
      - /dev/bus/usb:/dev/bus/usb

    ports:
      - "8100:8100"   # change if needed, use the same port for the -N flag

    volumes:
      - ./config.json:/data/config.json:ro
      - mastchain_data:/data

    environment:
      TZ: Europe/Madrid   # change to your timezone

    command: >
      -v 30
      -N 8100
      -C /data/config.json
      -H https://api.mastchain.io/api/upload USERPWD <YOUR-MASTCHAIN-TOKEN> INTERVAL 60
      --logfile /data/aiscatcher.log
      --loglevel info

volumes:
  mastchain_data:

